<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="F1Zone">
  <defs>
    <linearGradient id="f1Panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c0d10"/>
      <stop offset="100%" style="stop-color:#12080a"/>
    </linearGradient>
    <linearGradient id="f1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d2d"/>
      <stop offset="100%" style="stop-color:#c81212"/>
    </linearGradient>
  </defs>
  <!-- Rounded panel -->
  <rect x="10" y="10" width="100" height="120" rx="22" fill="url(#f1Panel)" stroke="#e10600" stroke-width="2.5"/>
  <!-- Speed lines trailing behind the car -->
  <g stroke="#e10600" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M24 52h20"/>
    <path d="M24 62h13"/>
    <path d="M24 72h20"/>
  </g>
  <!-- Stylised open-wheel silhouette: nose cone, body, rear wing -->
  <path d="M40 76h30l10-9h12l-4 9h6a3 3 0 0 1 0 6H52z" fill="url(#f1Accent)"/>
  <rect x="80" y="58" width="16" height="4" rx="2" fill="#ff5a5a"/>
  <!-- Wheels -->
  <circle cx="52" cy="88" r="8" fill="#0a0507" stroke="#e10600" stroke-width="2.5"/>
  <circle cx="84" cy="88" r="8" fill="#0a0507" stroke="#e10600" stroke-width="2.5"/>
  <!-- Chequered strip: the racing cue that reads even at 48px -->
  <g fill="#f5f5f5">
    <rect x="40" y="106" width="8" height="8"/>
    <rect x="56" y="106" width="8" height="8"/>
    <rect x="72" y="106" width="8" height="8"/>
    <rect x="48" y="114" width="8" height="8"/>
    <rect x="64" y="114" width="8" height="8"/>
    <rect x="80" y="114" width="8" height="8"/>
  </g>
</svg>
