  <defs>
    <linearGradient id="esTlo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a25"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#esTlo)"/>
  <!-- luk linii bocznej boiska -->
